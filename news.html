<style>
/* ------------------------------------------------------------------ *
   Dorn Lab — tokens
   Palette is UVM's, verbatim: Catamount Green, Gold, Vermont Slate,
   Morning Fog, Old Mill. Forest + mint are derivations used only where
   the brand palette needs a darker ground or a legible tint on it.
 * ------------------------------------------------------------------ */
:root{
  --catamount:#154734;
  --gold:#FFD100;
  --slate:#00313C;
  --fog:#F7F7F7;
  --mill:#DC582A;
  --forest:#061B14;
  --mint:#8FCFAF;
  --bone:#F4F6F3;

  --ink:#202C27;
  --ink-soft:#57665F;
  --ink-faint:#8A9791;
  --rule:#E3E7E4;
  --rule-dark:rgba(143,207,175,.20);

  /* spacing scale — every gap on the page comes from this set */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --s6:32px; --s7:48px; --s8:64px; --s9:96px; --s10:128px;

  /* layered, green-tinted elevation — base / elevated / floating */
  --e1:0 1px 2px rgba(21,71,52,.05), 0 2px 6px rgba(0,49,60,.04);
  --e2:0 1px 0 rgba(255,255,255,.7) inset, 0 2px 4px rgba(21,71,52,.05), 0 10px 26px rgba(0,49,60,.07);
  --e3:0 1px 0 rgba(255,255,255,.7) inset, 0 8px 18px rgba(21,71,52,.08), 0 26px 58px rgba(0,49,60,.13);

  --ease:cubic-bezier(.22,1,.36,1);
}

html{scroll-behavior:smooth;scroll-padding-top:88px;}
body{
  background:var(--fog);
  color:var(--ink);
  font-family:'Roboto',system-ui,sans-serif;
  font-size:17px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}

/* ---------- type roles ---------- */
.display{font-family:'Lora',Georgia,serif;letter-spacing:-.03em;line-height:1.04;font-weight:600;}
.display-sm{font-family:'Lora',Georgia,serif;letter-spacing:-.02em;line-height:1.18;font-weight:600;}
.tag{
  font-family:'Roboto Condensed',sans-serif;font-weight:600;font-size:11.5px;
  letter-spacing:.14em;text-transform:uppercase;line-height:1;
}
.datum{font-family:'Roboto Mono',monospace;font-size:12px;letter-spacing:.04em;}
/* Centred column. Measured at a 1440 viewport the edge-to-text inset was
   168px (120 gutter + 48 padding); 1250px brings that to 143px — 15% less. */
.wrap{width:100%;max-width:1250px;margin:0 auto;padding-left:var(--s5);padding-right:var(--s5);}
.section{padding-top:var(--s9);padding-bottom:var(--s9);}
@media (min-width:768px){
  .wrap{padding-left:var(--s7);padding-right:var(--s7);}
  .section{padding-top:var(--s10);padding-bottom:var(--s10);}
}

/* ---------- texture ---------- */
.grain{position:relative;}
.grain::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");
}
.lattice::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='97' viewBox='0 0 56 97'><g fill='none' stroke='%238FCFAF' stroke-width='1.1'><path d='M28 0.5 L55.5 16.7 L55.5 48.5 L28 64.7 L0.5 48.5 L0.5 16.7 Z'/><path d='M28 64.7 L28 96.5'/></g></svg>");
}

/* ---------- dark ground ---------- */
.ground-dark{
  position:relative;isolation:isolate;color:var(--bone);
  background:
    radial-gradient(900px 520px at 12% -8%, rgba(143,207,175,.16), transparent 62%),
    radial-gradient(760px 460px at 88% 8%, rgba(0,49,60,.85), transparent 65%),
    radial-gradient(680px 520px at 62% 108%, rgba(255,209,0,.11), transparent 60%),
    linear-gradient(168deg, #0A2419 0%, var(--forest) 38%, #04241F 74%, var(--slate) 100%);
}
/* The bar is a frosted pane: it lets the hue of whatever sits behind it
   come through, but brightness() lifts a dark backdrop before the
   translucent fog goes over it, so the green text never loses contrast. */
.nav{position:fixed;top:0;left:0;right:0;z-index:60;
  background-color:rgba(247,247,247,.72);
  -webkit-backdrop-filter:blur(18px) saturate(1.8) brightness(1.35);
  backdrop-filter:blur(18px) saturate(1.8) brightness(1.35);
  border-bottom:1px solid var(--rule);
  transform:translateY(0);will-change:transform;
  transition:transform .45s var(--ease), box-shadow .35s var(--ease);}
.nav.stuck{box-shadow:0 1px 24px rgba(0,49,60,.07);}
/* without backdrop-filter there is nothing to lift a dark backdrop,
   so fall back to a near-opaque bar rather than unreadable text */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .nav{background-color:rgba(247,247,247,.96);}
}
/* tucked away past the hero; slides back on hover near the top edge */
.nav.tucked{transform:translateY(-100%);}
.nav-inner{height:76px;display:flex;align-items:center;justify-content:space-between;gap:var(--s5);}
/* icon + name lockup: hexagonal mark beside the lab name, after the
   reference sites' headers */
.brandmark{display:inline-flex;align-items:center;gap:13px;flex:none;
  transition:transform .25s var(--ease);}
.brandmark:hover{transform:translateY(-1px);}
.brandmark:active{transform:translateY(1px);}
.brandmark:focus-visible{outline:2px solid var(--catamount);outline-offset:4px;border-radius:3px;}
.brandmark img{height:44px;width:auto;display:block;flex:none;}
.brandmark-the{display:block;margin-bottom:4px;
  font-family:'Roboto',system-ui,sans-serif;font-weight:700;font-size:11px;
  letter-spacing:.22em;text-transform:uppercase;color:var(--catamount);line-height:1;}
.brandmark-name{display:block;font-family:'Roboto',system-ui,sans-serif;font-weight:700;
  font-size:24px;letter-spacing:-.02em;line-height:1;color:var(--catamount);
  white-space:nowrap;}

.navlink{position:relative;font-family:'Roboto Condensed',sans-serif;font-weight:600;font-size:13.5px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--catamount);padding:10px 2px;
  transition:color .25s var(--ease), opacity .25s var(--ease);}
.navlink::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:2px;background:var(--gold);
  transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease);}
.navlink:hover::after,.navlink:focus-visible::after{transform:scaleX(1);}
.navlink:focus-visible{outline:2px solid var(--catamount);outline-offset:3px;border-radius:2px;}
.navlink:active{transform:translateY(1px);}

/* ---------- mobile menu ---------- */
.menu-btn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  width:44px;height:44px;border-radius:3px;flex:none;
  transition:transform .25s var(--ease), background-color .25s var(--ease);}
.menu-btn span{display:block;width:22px;height:2px;background:var(--catamount);
  transition:transform .3s var(--ease), opacity .25s var(--ease);}
.menu-btn:hover{background:rgba(21,71,52,.07);}
.menu-btn:focus-visible{outline:2px solid var(--catamount);outline-offset:2px;}
.menu-btn:active{transform:scale(.94);}
.menu-btn[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.menu-btn[aria-expanded="true"] span:nth-child(2){opacity:0;}
.menu-btn[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}

.menu-panel{position:fixed;top:76px;left:0;right:0;z-index:59;
  background:var(--fog);
  border-bottom:1px solid var(--rule);box-shadow:0 20px 44px rgba(0,49,60,.12);
  opacity:0;transform:translateY(-10px);visibility:hidden;
  transition:opacity .3s var(--ease), transform .3s var(--ease), visibility .3s var(--ease);}
.menu-panel.open{opacity:1;transform:translateY(0);visibility:visible;}
.menu-panel a{display:block;padding:15px 0;border-bottom:1px solid var(--rule);color:var(--catamount);
  font-family:'Roboto Condensed',sans-serif;font-weight:600;font-size:16px;
  letter-spacing:.12em;text-transform:uppercase;
  transition:transform .25s var(--ease), color .25s var(--ease);}
.menu-panel a:hover{transform:translateX(6px);}
.menu-panel a:focus-visible{outline:2px solid var(--catamount);outline-offset:3px;}
.menu-panel a:active{transform:translateX(6px) scale(.99);}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:10px;border-radius:3px;
  font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:14px;
  letter-spacing:.13em;text-transform:uppercase;padding:15px 26px;
  transition:transform .28s var(--ease), box-shadow .28s var(--ease),
             background-color .28s var(--ease), border-color .28s var(--ease), color .28s var(--ease);}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
.btn:active{transform:translateY(1px) scale(.995);}

.btn-gold{background:var(--gold);color:var(--catamount);
  box-shadow:0 1px 2px rgba(0,49,60,.24), 0 6px 14px rgba(0,49,60,.16);}
.btn-gold:hover{transform:translateY(-2px);
  box-shadow:0 3px 6px rgba(0,49,60,.26), 0 12px 26px rgba(0,49,60,.22), 0 0 0 1px rgba(255,209,0,.5);}

/* ---------- news ---------- */
.newsrow{display:grid;gap:var(--s3);padding:var(--s5) 0;border-top:1px solid var(--rule);
  transition:transform .35s var(--ease);}
.newsrow:hover{transform:translateX(5px);}
.newsrow:last-of-type{border-bottom:1px solid var(--rule);}
@media (min-width:768px){.newsrow{grid-template-columns:150px 1fr auto;align-items:baseline;gap:var(--s6);}}
/* colophon: the (c) scaled to the cap height of the text beside it */
.copy-mark{font-size:1.32em;line-height:0;}
.colophon-link{color:inherit;text-decoration:none;border-bottom:1px solid transparent;
  transition:color .25s var(--ease), border-color .25s var(--ease);}
.colophon-link:hover{color:var(--catamount);border-color:var(--catamount);}
.colophon-link:active{color:var(--catamount);border-color:var(--catamount);opacity:.75;}
.colophon-link:focus-visible{outline:2px solid var(--catamount);outline-offset:3px;border-radius:2px;}
.colophon-sep{padding:0 .55em;opacity:.65;}
/* the footer carries its own top padding - the last section doesn't need a full bottom pad too */
main > section:last-of-type{padding-bottom:var(--s2);}
.footlogo{display:inline-block;max-width:100%;border-radius:2px;transition:transform .35s var(--ease);}
.footlogo:hover{transform:translateY(-2px);}
.footlogo:active{transform:translateY(0);}
.footlogo:focus-visible{outline:2px solid var(--catamount);outline-offset:8px;}

/* ---------- motion ---------- */
.reveal{opacity:0;transform:translateY(20px);
  transition:opacity .8s var(--ease), transform .8s var(--ease);}
.reveal.in{opacity:1;transform:translateY(0);}

@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.enter{opacity:0;animation:rise .95s var(--ease) forwards;}
.d1{animation-delay:.05s}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;
    transition-duration:.001ms!important;}
  .reveal{opacity:1;transform:none;}
  .enter{opacity:1;}
}

/* a section that directly follows a page band needs less top padding */
.section.section-top{padding-top:var(--s8);}

/* inner-page title band */
.pagehead{padding-top:calc(76px + var(--s7));padding-bottom:var(--s7);}
@media (min-width:768px){
  .pagehead{padding-top:calc(76px + var(--s8));padding-bottom:var(--s8);}
}

/* current page in the nav */
.navlink.is-active{color:var(--catamount);}
.navlink.is-active::after{transform:scaleX(1);}

::selection{background:var(--gold);color:var(--catamount);}
/* category label on a news row (rows are drawn by assets/news.js) */
.news-cat{align-self:start;justify-self:start;}
@media (min-width:768px){.news-cat{align-self:center;}}
</style>
</head>

<script>
// sticky nav state — also forced while the mobile menu is open, so the
// bar stays legible when the panel sits over the dark hero
const nav = document.getElementById('nav');
const menuBtn = document.getElementById('menu-btn');
const menuPanel = document.getElementById('menu-panel');

// The bar sits out at the top of the page, tucks away once you have
// scrolled past the hero, and slides back when the cursor comes near the
// top edge — retreating again a couple of seconds after it leaves.
const TUCK_AFTER = 260;    // px scrolled before the bar may tuck away
const HOVER_BAND = 96;     // px from the top edge that counts as "at the header"
const LINGER     = 1100;   // ms the cursor must be away before it tucks again

let menuOpen = false, pointerUp = false, navFocused = false, awayTimer = null;
// hover is the pointer route back; scrolling up brings it back on any device
const canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
let lastY = window.scrollY, scrolledUp = false;

const render = () => {
  const scrolled = window.scrollY > TUCK_AFTER;
  const out = !scrolled || pointerUp || navFocused || menuOpen || scrolledUp;
  nav.classList.toggle('tucked', !out);
  nav.classList.toggle('stuck', window.scrollY > 40 || menuOpen);
};

const onScroll = () => {
  const y = window.scrollY;
  if (y < lastY - 4) scrolledUp = true;
  else if (y > lastY + 4) scrolledUp = false;
  lastY = y;
  render();
};

if (canHover) {
  window.addEventListener('mousemove', (e) => {
    if (e.clientY <= HOVER_BAND) {
      clearTimeout(awayTimer); awayTimer = null;
      if (!pointerUp) { pointerUp = true; render(); }
    } else if (pointerUp && !awayTimer) {
      awayTimer = setTimeout(() => {
        awayTimer = null; pointerUp = false; render();
      }, LINGER);
    }
  }, { passive: true });
  // cursor leaving the window entirely counts as leaving the header
  document.addEventListener('mouseleave', () => {
    if (!pointerUp) return;
    clearTimeout(awayTimer);
    awayTimer = setTimeout(() => { awayTimer = null; pointerUp = false; render(); }, LINGER);
  });
}

// keyboard users must never be tabbing into a bar they cannot see
nav.addEventListener('focusin',  () => { navFocused = true;  render(); });
nav.addEventListener('focusout', () => { navFocused = false; render(); });

const setMenu = (open) => {
  menuOpen = open;
  menuPanel.classList.toggle('open', open);
  menuBtn.setAttribute('aria-expanded', String(open));
  menuBtn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  render();
};

menuBtn.addEventListener('click', () => setMenu(!menuOpen));
menuPanel.addEventListener('click', (e) => { if (e.target.closest('a')) setMenu(false); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && menuOpen) { setMenu(false); menuBtn.focus(); }
});
window.addEventListener('resize', () => { if (menuOpen && window.innerWidth >= 1280) setMenu(false); });

render();
window.addEventListener('scroll', onScroll, { passive: true });

// scroll reveals — a deterministic sweep, so nothing can be scrolled past
// while still invisible (fast scrolls and anchor jumps used to skip elements)
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let pending = [...document.querySelectorAll('.reveal')];

if (reduce) {
  pending.forEach((el) => el.classList.add('in'));
  pending = [];
} else {
  let queued = false;
  const sweep = () => {
    queued = false;
    const line = window.innerHeight * 0.92;
    let shown = 0;
    pending = pending.filter((el) => {
      if (el.getBoundingClientRect().top > line) return true;
      el.style.transitionDelay = shown++ * 70 + 'ms';
      el.classList.add('in');
      return false;
    });
    if (!pending.length) {
      window.removeEventListener('scroll', request);
      window.removeEventListener('resize', request);
    }
  };
  const request = () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(sweep);
  };
  window.addEventListener('scroll', request, { passive: true });
  window.addEventListener('resize', request);
  sweep();
}
</script>
